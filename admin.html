<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hesap Yönetimi</title><link rel="stylesheet" href="assets/css/app.css"><style>body{display:block;max-width:980px;margin:0 auto;padding:28px 18px 60px}.admin-shell{display:grid;gap:16px}.admin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.admin-title{font-family:'Fraunces',serif;font-size:28px;margin:0}.admin-card{background:var(--bg-panel);border:1px solid rgba(116,217,159,.14);border-radius:16px;padding:16px}.admin-form{display:grid;grid-template-columns:1fr auto;gap:8px}.admin-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--paper);border-radius:10px;padding:10px 12px;outline:none}.admin-input:focus{border-color:rgba(116,217,159,.4)}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-users{display:grid;gap:8px}.admin-user{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.02)}.admin-user b{font-family:'IBM Plex Mono',monospace}.admin-meta{font-size:10px;color:var(--muted);margin-top:4px}.admin-cred{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.admin-cred div{padding:10px;border-radius:10px;background:rgba(116,217,159,.06);border:1px solid rgba(116,217,159,.13)}.admin-cred span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.admin-cred strong{display:block;margin-top:4px;font:700 13px 'IBM Plex Mono',monospace;overflow-wrap:anywhere}.admin-warning{font-size:10px;color:var(--gold);line-height:1.5;margin-top:8px}.admin-error{color:#ff9d9d;font-size:10px;min-height:15px}.admin-ok{color:var(--moss-bright);font-size:10px;min-height:15px}@media(max-width:650px){.admin-form,.admin-user,.admin-cred{grid-template-columns:1fr}.admin-head{flex-direction:column}}</style></head><body><main class="admin-shell"><header class="admin-head"><div><h1 class="admin-title">Hesap Yönetimi</h1><p class="cloud-muted">E-posta olmadan kullanıcı oluştur, giriş bilgilerini sıfırla ve hesapları devre dışı bırak.</p></div><a href="index.html" class="modal-btn ghost" style="text-decoration:none">Uygulamaya Dön</a></header><section class="admin-card"><div class="settings-section-title" style="margin-top:0">Bağlantı</div><div class="admin-form"><input class="admin-input" type="password" id="adminSecret" placeholder="Yönetici anahtarı"><button class="modal-btn primary" id="adminLoad">Bağlan</button></div><div class="admin-error" id="adminError"></div></section><section class="admin-card"><div class="admin-actions"><button class="modal-btn primary" id="adminCreate">+ Yeni Kullanıcı Oluştur</button><button class="modal-btn ghost" id="adminRefresh">Yenile</button></div><div id="adminCredentialResult"></div></section><section class="admin-card"><div class="settings-section-title" style="margin-top:0">Kullanıcılar</div><div class="admin-users" id="adminUsers"><div class="cloud-muted">Yönetici anahtarını girip bağlan.</div></div></section></main><script src="assets/js/cloud-config.js"></script><script src="assets/js/admin.js"></script></body></html>
